{% load static %}
<!DOCTYPE html>
<html lang="en" class="bg-[#F8FAFC] antialiased">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Challenge | Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
    <style>
        form input[type="text"], form select, form textarea { width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1rem 1.25rem; font-size: 0.95rem; font-weight: 500; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        form input:focus, form select:focus, form textarea:focus { outline: none; border-color: #e11d48; box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.1); }
        .reveal-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-[2rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)] border border-slate-200/60 p-8 md:p-12 reveal-up relative overflow-hidden">
        <div class="flex items-center gap-5 mb-8 border-b border-slate-100 pb-8">
            <div class="w-14 h-14 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center shrink-0 border border-rose-100"><i data-lucide="edit-3" class="w-6 h-6"></i></div>
            <div><h1 class="text-2xl font-black tracking-tight text-slate-900 mb-1">Edit Challenge</h1><p class="text-sm font-medium text-slate-500">Update the details or change the status to solved.</p></div>
        </div>
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-[11px] font-black uppercase tracking-widest text-slate-500 mb-2 ml-1">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <div class="pt-8 mt-4 flex flex-col-reverse sm:flex-row items-center justify-end gap-4">
                <a href="{% url 'business_challenge_list' %}" class="w-full sm:w-auto px-6 py-3.5 text-slate-500 hover:text-slate-900 font-black text-[11px] uppercase tracking-widest">Cancel</a>
                <button type="submit" class="w-full sm:w-auto px-8 py-3.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-[11px] font-black uppercase tracking-widest shadow-lg active:scale-95">Save Changes</button>
            </div>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
