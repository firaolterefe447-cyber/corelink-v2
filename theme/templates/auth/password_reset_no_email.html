{% extends 'base.html' %}
{% load i18n %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="min-h-[100dvh] flex items-center justify-center bg-slate-50 px-4 py-10">
    <div class="w-full max-w-xl">
        <!-- Back Navigation -->
        <div class="mb-6">
            <a href="{% url 'password_reset_method_selection' %}" class="inline-flex items-center gap-2 text-slate-500 hover:text-blue-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span class="text-sm font-bold">{% trans "Back" %}</span>
            </a>
        </div>

        <div class="rounded-3xl border border-slate-200 bg-white p-7 shadow-sm sm:p-9">
            <h1 class="text-3xl font-black tracking-tight text-slate-900">{% trans "Add Email" %}</h1>
            <p class="mt-3 text-sm font-semibold text-slate-500">
                {% trans "Your account needs an email address for password recovery" %}
            </p>

            <div class="mt-8 space-y-3">
                <a href="{% url 'register_email' %}" class="block w-full rounded-xl bg-slate-900 px-4 py-3 text-center text-sm font-black uppercase tracking-[0.15em] text-white transition hover:bg-slate-800 active:scale-[0.99]">
                    {% trans "Add Email" %}
                </a>
                <a href="{% url 'password_reset_method_selection' %}" class="block text-sm font-bold text-slate-500 hover:text-blue-700 transition-colors">
                    {% trans "Try Telegram Instead" %}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
