{% extends 'base.html' %}
{% load i18n %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="min-h-[100dvh] flex items-center justify-center bg-slate-50 px-4 py-10">
    <div class="w-full max-w-xl">
        <div class="rounded-3xl border border-slate-200 bg-white p-7 shadow-sm sm:p-9">
            <div class="flex justify-center mb-6">
                <div class="flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-green-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
            </div>
            <h1 class="text-center text-3xl font-black tracking-tight text-slate-900">{% trans "Password Reset Complete" %}</h1>
            <p class="mt-3 text-center text-sm font-semibold text-slate-500">{% trans "Your password has been successfully reset. You can now log in with your new password." %}</p>

            <div class="mt-8">
                <a href="{% url 'login' %}" class="block w-full rounded-xl bg-blue-600 px-4 py-3 text-center text-sm font-black uppercase tracking-[0.15em] text-white transition hover:bg-blue-700 active:scale-[0.99]">
                    {% trans "Sign In" %}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
