{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<main class="relative z-10 pt-32 pb-safe px-4 sm:px-6 md:px-8 max-w-[40rem] mx-auto min-h-[100dvh] w-full">
    <div class="bg-white border border-red-200 shadow-lg rounded-[24px] p-8 text-center">
        <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <i data-lucide="alert-triangle" class="w-8 h-8 text-red-600"></i>
        </div>
        
        <h1 class="text-2xl font-extrabold text-slate-900 mb-4 nav-heading">
            {% trans "Deactivate Account" %}
        </h1>
        
        <p class="text-slate-600 font-medium mb-8 leading-relaxed">
            {% trans "Are you sure you want to deactivate your account? This action cannot be undone and you will lose access to all your data." %}
        </p>

        <form method="POST" action="{% url 'deactivate_account' %}" class="flex flex-col sm:flex-row gap-4 justify-center">
            {% csrf_token %}
            <a href="{% url 'dashboard' %}" class="px-6 py-3 rounded-full text-[15px] font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-all">
                {% trans "Cancel" %}
            </a>
            <button type="submit" class="px-6 py-3 rounded-full text-[15px] font-bold text-white bg-red-600 hover:bg-red-700 shadow-md shadow-red-600/20 transition-all">
                {% trans "Yes, Deactivate My Account" %}
            </button>
        </form>
    </div>
</main>
{% endblock %}
