{% load i18n %}

<!--
    ==============================================
    DESKTOP NAVIGATION (Minimal Focus Mode)
    ==============================================
-->
<div class="hidden md:flex fixed top-8 left-0 right-0 z-[60] justify-center pointer-events-none px-4 transition-all duration-500 animate-fade-in-down">
    <div class="pointer-events-auto flex items-center p-1.5 bg-white/80 backdrop-blur-xl border border-slate-200/60 shadow-[0_8px_32px_rgba(0,0,0,0.06)] rounded-full">
        <a href="{% url 'dashboard' %}" class="px-8 py-3 rounded-full text-[14px] font-bold bg-gradient-to-r from-[#0A66C2] to-[#0052a3] text-white shadow-md shadow-blue-600/20 hover:shadow-[0_12px_24px_-8px_rgba(10,102,194,0.5)] hover:-translate-y-0.5 transition-all flex items-center gap-2.5 active:scale-95">
            <i data-lucide="arrow-left" class="w-4 h-4 opacity-90"></i>
            <span>{% trans "Back to Dashboard" %}</span>
        </a>
    </div>
</div>

<!--
    ==============================================
    MOBILE TOP ACTIONS (Minimal Back Pill)
    ==============================================
-->
<div class="fixed top-5 left-4 z-50 flex items-center md:hidden pointer-events-none animate-fade-in-down pt-safe">
    <a href="{% url 'dashboard' %}" class="pointer-events-auto px-5 py-3 bg-white/95 backdrop-blur-xl border border-slate-200/80 shadow-[0_8px_20px_rgba(0,0,0,0.06)] text-slate-700 hover:text-[#0A66C2] rounded-full flex items-center justify-center gap-2.5 transition-all active:scale-95 group font-bold text-[13px]">
        <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"></i>
        <span>{% trans "Dashboard" %}</span>
    </a>
</div>
