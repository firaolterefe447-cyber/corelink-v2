{% extends 'base.html' %}
{% load static %}

{% block navbar %}
<!-- THE FOUNDER CONSOLE NAVIGATION -->
<div class="fixed top-0 left-0 right-0 z-[100] bg-slate-950 border-b border-white/10">
    <div class="max-w-[1800px] mx-auto px-6 h-16 flex items-center justify-between">
        
        <!-- Brand / Dashboard Link -->
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 text-white font-black tracking-tighter text-xl">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </div>
            <span>CONSOLE</span>
        </a>

        <!-- Management Links -->
        <div class="hidden md:flex items-center gap-8 text-sm font-bold text-slate-400">
            <!-- Overview -->
            <a href="{% url 'dashboard' %}" class="hover:text-white transition-colors">Overview</a>

            <!-- LIVE WORKSPACE LINK -->
            <!-- Now links directly to the Founder Workspace View we created -->
            <a href="{% url 'founder_workspace' %}" class="flex items-center gap-2 {% if 'workspace' in request.path %}text-white{% endif %} hover:text-white transition-colors group">
                <i data-lucide="sparkles" class="w-4 h-4 text-blue-500 group-hover:text-blue-400 transition-colors"></i>
                Workspace
            </a>

            <!-- Other Links -->
            <a href="{% url 'manage_services' %}" class="{% if 'services' in request.path %}text-white{% endif %} hover:text-white transition-colors">Services</a>
            <a href="{% url 'manage_news_list' %}" class="{% if 'news' in request.path %}text-white{% endif %} hover:text-white transition-colors">Newsroom</a>
            <a href="{% url 'founder_settings' %}" class="{% if 'settings' in request.path %}text-white{% endif %} hover:text-white transition-colors">Settings</a>
        </div>

        <!-- Public View Button -->
        <a href="{% url 'public_profile' user.corelink_id %}" target="_blank" class="px-4 py-2 bg-white text-slate-900 text-xs font-black rounded-full hover:bg-slate-200 transition-colors uppercase tracking-widest">
            View Site <i data-lucide="arrow-up-right" class="inline w-3 h-3 ml-1"></i>
        </a>
    </div>
</div>
{% endblock navbar %}

{% block content %}
<div class="pt-24 pb-12 px-6 max-w-7xl mx-auto min-h-screen">
    {% block console_content %}{% endblock %}
</div>
{% endblock %}
