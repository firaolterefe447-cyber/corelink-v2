<aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
       class="absolute inset-y-0 left-0 z-30 w-72 bg-white border-r border-gray-100 transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 flex flex-col">

    <!-- Logo Area -->
    <div class="h-20 flex items-center px-8 border-b border-gray-50">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-600 p-1.5 rounded-lg text-white">
                <i data-lucide="gem" class="w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight">CoreLink</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto no-scrollbar">

        <div class="px-4 mb-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Workspace</div>

        <!-- Example HTMX Link -->
        <!-- Ensure you have a URL named 'founder_dashboard' (or similar) -->
        <a href="#"
           hx-get="{% url 'founder_dashboard' %}"
           hx-target="#dashboard-body"
           hx-swap="innerHTML"
           @click="sidebarOpen = false"
           class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-xl hover:bg-slate-50 hover:text-emerald-700 transition-colors group">
            <i data-lucide="building-2" class="w-5 h-5 text-slate-400 group-hover:text-emerald-600"></i>
            Founder
        </a>

        <a href="#"
           hx-get="{% url 'expert_dashboard' %}"
           hx-target="#dashboard-body"
           hx-swap="innerHTML"
           @click="sidebarOpen = false"
           class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-xl hover:bg-slate-50 hover:text-emerald-700 transition-colors group">
            <i data-lucide="briefcase" class="w-5 h-5 text-slate-400 group-hover:text-emerald-600"></i>
            Expert
        </a>

        <a href="#"
           hx-get="{% url 'visionary_dashboard' %}"
           hx-target="#dashboard-body"
           hx-swap="innerHTML"
           @click="sidebarOpen = false"
           class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-xl hover:bg-slate-50 hover:text-emerald-700 transition-colors group">
            <i data-lucide="sprout" class="w-5 h-5 text-slate-400 group-hover:text-emerald-600"></i>
            Visionary
        </a>
    </nav>

    <!-- User Profile / Footer -->
    <div class="p-4 border-t border-gray-50">
        <div class="flex items-center gap-3 px-4 py-3 bg-slate-50 rounded-xl">
            <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold">
                {{ request.user.username|slice:":1"|upper }}
            </div>
            <div class="overflow-hidden">
                <p class="text-sm font-bold text-slate-700 truncate">{{ request.user.username }}</p>
                <p class="text-xs text-slate-500 truncate">View Profile</p>
            </div>
        </div>
    </div>
</aside>
