{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | CoreLink</title>

    <!-- 1. STRICT FAVICON LINKING -->
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">

    <!-- 2. Tailwind & HTMX -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- 3. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- 4. BRAND THEME CONFIG (Matched to Website) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            900: '#0f172a', /* Dark Navy */
                            800: '#1e3a8a', /* Royal Blue */
                            700: '#1d4ed8', /* Standard Blue */
                            600: '#2563eb', /* Lighter Blue */
                            500: '#3b82f6', /* Blue Accent */
                            50:  '#eff6ff', /* Light Background */
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'card': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
                        'glow': '0 0 20px rgba(30, 58, 138, 0.15)', /* Blue Glow */
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { padding-top: 80px; padding-bottom: 90px; }
        @media (min-width: 768px) { body { padding-bottom: 40px; } }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-brand-600 selection:text-white"
      x-data="{ modalOpen: false }"
      @keydown.escape.window="modalOpen = false">

    <!-- ======================== -->
    <!-- MODAL OVERLAY (Alpine Controlled) -->
    <!-- ======================== -->
    <div x-show="modalOpen" style="display: none;"
         class="fixed inset-0 z-[100] bg-brand-900/40 backdrop-blur-sm flex items-center justify-center p-4"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 backdrop-blur-none"
         x-transition:enter-end="opacity-100 backdrop-blur-sm">

         <!-- This ID is where HTMX will inject the form -->
         <div id="modal-container" @click.away="modalOpen = false" class="w-full max-w-lg"></div>
    </div>

    <!-- ======================== -->
    <!-- TOP NAVIGATION (PC)      -->
    <!-- ======================== -->
    <nav class="fixed top-0 left-0 right-0 h-20 bg-white border-b border-gray-200 z-50 px-6 md:px-10 flex justify-between items-center shadow-sm">
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 group">
            <!-- Used Favicon Logic Here -->
            <img src="{% static 'img/favicon.png' %}"
                 class="w-10 h-10 object-contain drop-shadow-sm group-hover:scale-110 transition-transform duration-300"
                 alt="CoreLink Logo">
            <div class="flex flex-col">
                <span class="text-xl font-display font-extrabold text-brand-900 tracking-tight leading-none">CoreLink</span>
                <span class="text-[10px] font-bold text-brand-600 uppercase tracking-widest leading-none">Command</span>
            </div>
        </a>

        <div class="hidden md:flex items-center gap-10">
            <a href="{% url 'dashboard' %}" class="text-sm font-bold text-brand-800 border-b-2 border-brand-800 pb-1 transition-all">Dashboard</a>
            <a href="#" class="text-sm font-semibold text-gray-600 hover:text-brand-800 transition-colors pb-1 border-b-2 border-transparent hover:border-gray-200">Update</a>
            <a href="#" class="text-sm font-semibold text-gray-600 hover:text-brand-800 transition-colors pb-1 border-b-2 border-transparent hover:border-gray-200">Profile</a>
            <a href="{% url 'logout' %}" class="text-sm font-bold text-red-500 hover:text-red-700 transition-colors pb-1 border-b-2 border-transparent">Logout</a>
        </div>

        <div class="flex items-center gap-4">
            <div class="relative group cursor-pointer pl-4 border-l border-gray-100">
                {% if request.user.profile.avatar %}
                    <img src="{{ request.user.profile.avatar.url }}" class="h-10 w-10 rounded-full object-cover border-2 border-white shadow-md group-hover:scale-105 transition-transform ring-2 ring-transparent group-hover:ring-brand-500">
                {% else %}
                    <div class="h-10 w-10 rounded-full bg-brand-800 text-white flex items-center justify-center font-bold border-2 border-white shadow-md">
                        {{ request.user.first_name|slice:":1" }}
                    </div>
                {% endif %}
                <!-- Status Dot: Green for Active -->
                <div class="absolute bottom-0 right-0 h-3 w-3 bg-green-500 border-2 border-white rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- ======================== -->
    <!-- MAIN CONTENT INJECTION   -->
    <!-- ======================== -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block dashboard_content %}{% endblock %}
    </main>

    <!-- ======================== -->
    <!-- BOTTOM NAVIGATION (Mobile) -->
    <!-- ======================== -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 flex justify-around items-center py-4 px-6 pb-6 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)]">
        <a href="{% url 'dashboard' %}" class="flex flex-col items-center gap-1 group text-brand-800">
            <i data-lucide="layout-dashboard" class="h-6 w-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Dashboard</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 group text-gray-400 hover:text-brand-800 transition-colors">
            <i data-lucide="user" class="h-6 w-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Profile</span>
        </a>
        <a href="{% url 'logout' %}" class="flex flex-col items-center gap-1 group text-gray-400 hover:text-red-600 transition-colors">
            <i data-lucide="log-out" class="h-6 w-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Logout</span>
        </a>
    </nav>

    <script>
        lucide.createIcons();
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            lucide.createIcons();
        });
    </script>
</body>
</html>
